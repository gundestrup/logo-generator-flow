<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>logo-generator — editor</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --border: #24334f;
        --text: #dbe4f3;
        --dim: #8ba0c2;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.5 -apple-system,
          "SF Mono",
          Menlo,
          monospace;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      h1 span {
        color: var(--accent);
      }
      select,
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #04121f;
        font-weight: 700;
        border: none;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) 1fr 1fr;
        gap: 12px;
        height: calc(100vh - 90px);
      }
      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: 1fr;
          height: auto;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .card h2 {
        margin: 0;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-bottom: 1px solid var(--border);
      }
      .card .body {
        padding: 10px;
        flex: 1;
        overflow: auto;
      }
      textarea {
        width: 100%;
        height: 100%;
        min-height: 300px;
        resize: none;
        background: #0a0f1a;
        color: #c9d6ea;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font:
          12px/1.5 ui-monospace,
          Menlo,
          monospace;
      }
      .preview {
        display: grid;
        place-items: center;
        background: repeating-conic-gradient(#1a2438 0 25%, #131c2e 0 50%) 0 0 /
          20px 20px;
        border-radius: 8px;
        padding: 10px;
        min-height: 120px;
      }
      .preview svg {
        max-width: 100%;
        height: auto;
      }
      #status {
        font-size: 12px;
        min-height: 1.6em;
      }
      #status.err {
        color: #f87171;
      }
      #status.ok {
        color: #34d399;
      }
      .files {
        margin-top: 10px;
        font-size: 12px;
      }
      .files a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>logo-generator <span>editor</span></h1>
      <label
        >site
        <select id="site"></select
      ></label>
      <button type="button" id="render-all">render all formats</button>
      <button type="button" id="save" class="primary">save</button>
      <span id="status"></span>
    </header>
    <div class="grid">
      <section class="card">
        <h2>config</h2>
        <div class="body">
          <textarea id="config" spellcheck="false"></textarea>
        </div>
      </section>
      <section class="card">
        <h2>template</h2>
        <div class="body"><div class="preview" id="tpl"></div></div>
      </section>
      <section class="card">
        <h2>generated</h2>
        <div class="body">
          <div class="preview" id="gen"></div>
          <div class="files" id="files"></div>
        </div>
      </section>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const status = (msg, ok) => {
        $("status").textContent = msg;
        $("status").className = msg ? (ok ? "ok" : "err") : "";
      };

      async function j(method, url, body) {
        const r = await fetch(url, { method, body });
        const t = await r.text();
        let d = {};
        try {
          d = JSON.parse(t);
        } catch {
          d = { error: t };
        }
        if (!r.ok) throw new Error(d.error || `${r.status}`);
        return d;
      }

      async function loadSites() {
        const d = await j("GET", "/api/sites");
        $("site").innerHTML = d.sites
          .map((s) => `<option>${s}</option>`)
          .join("");
        $("site").onchange = () => loadSite($("site").value);
        if (d.sites[0]) loadSite(d.sites[0]);
      }

      async function loadSite(name) {
        try {
          const d = await j(
            "GET",
            `/api/site?name=${encodeURIComponent(name)}`,
          );
          $("config").value = d.config;
          $("tpl").innerHTML = d.template || "";
          $("files").innerHTML = "";
          preview();
        } catch (e) {
          status(e.message, false);
        }
      }

      let timer;
      function preview() {
        clearTimeout(timer);
        timer = setTimeout(async () => {
          try {
            const d = await j("POST", "/api/preview", $("config").value);
            $("gen").innerHTML = d.svg;
            status("");
          } catch (e) {
            status(e.message, false);
          }
        }, 350);
      }

      $("config").oninput = preview;
      $("save").onclick = async () => {
        try {
          const name = $("site").value;
          await j(
            "POST",
            `/api/save?name=${encodeURIComponent(name)}`,
            $("config").value,
          );
          status(`saved configs/${name}.json`, true);
        } catch (e) {
          status(e.message, false);
        }
      };
      $("render-all").onclick = async () => {
        try {
          const d = await j("POST", "/api/render", $("config").value);
          status(`wrote: ${d.files.join(", ")}`, true);
          $("files").innerHTML = d.files
            .map(
              (f) =>
                `<a href="/out/${f}" target="_blank" rel="noopener">${f}</a>`,
            )
            .join(" · ");
        } catch (e) {
          status(e.message, false);
        }
      };
      loadSites();
    </script>
  </body>
</html>
