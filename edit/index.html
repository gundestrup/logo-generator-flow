<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>logo-generator — editor</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --border: #24334f;
        --text: #dbe4f3;
        --dim: #8ba0c2;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.5 -apple-system,
          "SF Mono",
          Menlo,
          monospace;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      h1 span {
        color: var(--accent);
      }
      select,
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #04121f;
        font-weight: 700;
        border: none;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) 1fr 1fr;
        gap: 12px;
        height: calc(100vh - 90px);
      }
      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: 1fr;
          height: auto;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .card h2 {
        margin: 0;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-bottom: 1px solid var(--border);
      }
      .card .body {
        padding: 10px;
        flex: 1;
        overflow: auto;
      }
      textarea {
        width: 100%;
        height: 100%;
        min-height: 300px;
        resize: none;
        background: #0a0f1a;
        color: #c9d6ea;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font:
          12px/1.5 ui-monospace,
          Menlo,
          monospace;
      }
      .preview {
        display: grid;
        place-items: center;
        background: repeating-conic-gradient(#1a2438 0 25%, #131c2e 0 50%) 0 0 /
          20px 20px;
        border-radius: 8px;
        padding: 10px;
        min-height: 120px;
      }
      .preview svg {
        max-width: 100%;
        height: auto;
      }
      #status {
        font-size: 12px;
        min-height: 1.6em;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
        color: var(--dim);
      }
      input[type="color"] {
        width: 34px;
        height: 26px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        cursor: pointer;
      }
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(4, 10, 20, 0.7);
        display: grid;
        place-items: center;
        z-index: 10;
      }
      #modal[hidden] {
        display: none;
      }
      .dlg {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        width: min(560px, 90vw);
        max-height: 80vh;
        overflow: auto;
      }
      .dlg h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .pick {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin: 4px 0;
        text-align: left;
      }
      .map-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
        font-size: 12px;
      }
      .map-row code {
        color: var(--accent);
        min-width: 110px;
      }
      .map-row .dim {
        color: var(--dim);
        min-width: 130px;
      }
      #tpl-stage {
        position: relative;
        width: 100%;
      }
      #tpl-stage svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #tpl-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .region {
        position: absolute;
        border: 2px dashed var(--dim);
        border-radius: 4px;
      }
      .region.on {
        border-color: var(--accent);
      }
      .region.txt {
        border-style: dotted;
      }
      .region.txt.on {
        border-color: #34d399;
      }
      .region b {
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 10px;
        font-weight: 600;
        color: #fff;
        background: rgba(4, 12, 24, 0.75);
        padding: 0 4px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .pick img {
        width: 40px;
        height: 40px;
        object-fit: contain;
        background: #0a0f1a;
        border-radius: 6px;
      }
      #status.err {
        color: #f87171;
      }
      #status.ok {
        color: #34d399;
      }
      .files {
        margin-top: 10px;
        font-size: 12px;
      }
      .files a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>logo-generator <span>editor</span></h1>
      <label
        >site
        <select id="site"></select
      ></label>
      <button type="button" id="render-all">render all formats</button>
      <button type="button" id="save" class="primary">save</button>
      <span id="status"></span>
    </header>
    <div class="tools">
      <label
        >image
        <select id="img-slot">
          <option>image1</option>
          <option>image2</option>
          <option>image3</option>
          <option>image4</option>
          <option>image5</option>
          <option>image6</option>
        </select>
      </label>
      <button type="button" id="pick-img">pick…</button>
      <button type="button" id="map-tpl">map template…</button>
      <label
        ><input type="checkbox" id="show-regions" checked /> outlines</label
      >
      <span id="img-color-wrap" hidden
        >svg fill <input type="color" id="img-color" value="#ffffff" /> stroke
        <input type="color" id="img-stroke" value="#000000" />
        <button type="button" id="img-color-clear" title="remove recolor">
          ×
        </button>
      </span>
      <label
        >font
        <select id="font">
          <option value="">—</option>
        </select></label
      >
      <label
        >text
        <select id="txt-slot">
          <option>text1</option>
          <option>text2</option>
          <option>text3</option>
          <option>text4</option>
          <option>text5</option>
          <option>text6</option>
        </select>
        <input type="color" id="txt-color" value="#ffffff" />
      </label>
    </div>
    <div class="grid">
      <section class="card">
        <h2>config</h2>
        <div class="body">
          <textarea id="config" spellcheck="false"></textarea>
        </div>
      </section>
      <section class="card">
        <h2>template</h2>
        <div class="body">
          <div class="preview">
            <div id="tpl-stage">
              <div id="tpl"></div>
              <div id="tpl-overlay" hidden></div>
            </div>
          </div>
        </div>
      </section>
      <section class="card">
        <h2>generated</h2>
        <div class="body">
          <div class="preview" id="gen"></div>
          <div class="files" id="files"></div>
        </div>
      </section>
    </div>
    <div id="map-modal" hidden>
      <div class="dlg">
        <h2>template regions — assign each element a slot</h2>
        <div id="map-list"></div>
        <button type="button" id="map-apply" class="primary">apply</button>
        <button type="button" id="map-close">cancel</button>
      </div>
    </div>
    <div id="modal" hidden>
      <div class="dlg">
        <h2>assets/images</h2>
        <div id="img-list"></div>
        <button type="button" id="modal-close">close</button>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const status = (msg, ok) => {
        $("status").textContent = msg;
        $("status").className = msg ? (ok ? "ok" : "err") : "";
      };

      async function j(method, url, body) {
        const r = await fetch(url, { method, body });
        const t = await r.text();
        let d = {};
        try {
          d = JSON.parse(t);
        } catch {
          d = { error: t };
        }
        if (!r.ok) throw new Error(d.error || `${r.status}`);
        return d;
      }

      async function loadSites() {
        const d = await j("GET", "/api/sites");
        $("site").innerHTML = d.sites
          .map((s) => `<option>${s}</option>`)
          .join("");
        $("site").onchange = () => loadSite($("site").value);
        if (d.sites[0]) loadSite(d.sites[0]);
      }

      async function loadSite(name) {
        try {
          const d = await j(
            "GET",
            `/api/site?name=${encodeURIComponent(name)}`,
          );
          $("config").value = d.config;
          $("tpl").innerHTML = d.template || "";
          $("files").innerHTML = "";
          syncImgColors();
          preview();
          try {
            const a = await j("POST", "/api/template-analyze", d.config);
            regions = a.elements;
            tplBox = a.viewBox;
            for (const e of a.elements) if (e.slot) slotMap[e.id] = e.slot;
            drawRegions();
          } catch {
            regions = null;
            drawRegions();
          }
        } catch (e) {
          status(e.message, false);
        }
      }

      let regions = null,
        tplBox = null;
      const slotMap = {};

      function drawRegions() {
        const ov = $("tpl-overlay");
        ov.innerHTML = "";
        if (!regions || !tplBox || tplBox.length !== 4) {
          ov.hidden = true;
          return;
        }
        const [minX, minY, vbW, vbH] = tplBox.map(Number);
        $("tpl-stage").style.aspectRatio = `${vbW} / ${vbH}`;
        for (const e of regions) {
          const d = document.createElement("div");
          const slot = slotMap[e.id];
          d.className = `region${e.tag === "text" ? " txt" : ""}${slot ? " on" : ""}`;
          const x = ((e.x - minX) / vbW) * 100;
          const y = ((e.y - minY) / vbH) * 100;
          const w = Math.max((e.w / vbW) * 100, 1.2);
          const h = Math.max((e.h / vbH) * 100, 1.2);
          d.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
          const b = document.createElement("b");
          b.textContent = slot || e.id;
          d.append(b);
          ov.append(d);
        }
        ov.hidden = !$("show-regions").checked;
      }
      $("show-regions").onchange = drawRegions;

      let timer;
      function preview() {
        clearTimeout(timer);
        timer = setTimeout(async () => {
          try {
            const d = await j("POST", "/api/preview", $("config").value);
            $("gen").innerHTML = d.svg;
            status("");
          } catch (e) {
            status(e.message, false);
          }
        }, 350);
      }

      $("config").oninput = preview;
      const patch = (fn) => {
        let o;
        try {
          o = JSON.parse($("config").value);
        } catch {
          status("invalid JSON", false);
          return;
        }
        fn(o);
        $("config").value = JSON.stringify(o, null, 2);
        preview();
      };

      $("pick-img").onclick = async () => {
        try {
          const d = await j("GET", "/api/images");
          if (!d.images.length) {
            status("no files in assets/images", false);
            return;
          }
          $("img-list").innerHTML = "";
          for (const i of d.images) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "pick";
            const img = document.createElement("img");
            img.src = `/asset/${i.path.replace("assets/", "")}`;
            img.alt = "";
            b.append(img, document.createTextNode(i.name));
            b.onclick = () => {
              const slot = $("img-slot").value;
              patch((o) => {
                o.images ||= {};
                o.images[slot] = i.path;
              });
              syncImgColors();
              $("modal").hidden = true;
            };
            $("img-list").append(b);
          }
          $("modal").hidden = false;
        } catch (e) {
          status(e.message, false);
        }
      };
      $("modal-close").onclick = () => {
        $("modal").hidden = true;
      };

      const imgSrc = (cur) => (typeof cur === "string" ? cur : cur?.src || "");
      const isSvgSrc = (src) =>
        src.toLowerCase().endsWith(".svg") || src.startsWith("data:image/svg");

      const setImageColor = (key, val) => {
        const slot = $("img-slot").value;
        patch((o) => {
          o.images ||= {};
          const cur = o.images[slot];
          const src = imgSrc(cur);
          if (!isSvgSrc(src)) {
            status("recolor needs an .svg image", false);
            return;
          }
          const next =
            typeof cur === "object" && cur ? { ...cur, src } : { src };
          if (val) next[key] = val;
          else delete next[key];
          o.images[slot] = next;
        });
      };
      $("img-color").oninput = () =>
        setImageColor("fill", $("img-color").value);
      $("img-stroke").oninput = () =>
        setImageColor("stroke", $("img-stroke").value);
      $("img-color-clear").onclick = () =>
        patch((o) => {
          const cur = o.images?.[$("img-slot").value];
          if (typeof cur === "object" && cur)
            o.images[$("img-slot").value] = cur.src || "";
        });

      // reflect the slot's current colors/svg-ness in the toolbar
      const syncImgColors = () => {
        let src = "";
        try {
          const o = JSON.parse($("config").value);
          const cur = o.images?.[$("img-slot").value];
          src = imgSrc(cur);
          if (cur?.fill) $("img-color").value = cur.fill;
          if (cur?.stroke) $("img-stroke").value = cur.stroke;
        } catch {
          /* mid-edit json */
        }
        $("img-color-wrap").hidden = !isSvgSrc(src);
      };
      $("img-slot").onchange = syncImgColors;

      $("txt-color").oninput = () => {
        const slot = $("txt-slot").value;
        const color = $("txt-color").value;
        patch((o) => {
          o.text ||= {};
          const cur = o.text[slot];
          const text = typeof cur === "string" ? cur : cur?.text || "";
          o.text[slot] = { text, color };
        });
      };

      async function loadFonts() {
        try {
          const d = await j("GET", "/api/fonts");
          $("font").innerHTML =
            `<option value="">—</option>` +
            d.fonts
              .map((f) => `<option value="${f.path}">${f.name}</option>`)
              .join("");
        } catch {
          /* no assets/fonts dir */
        }
      }
      $("font").onchange = () => {
        const path = $("font").value;
        if (!path) return;
        const family = path
          .split("/")
          .pop()
          .replace(/\.[^.]+$/, "");
        patch((o) => {
          o.render ||= {};
          o.render.fontFiles = [path];
          o.render.fontFamily = family;
        });
      };
      $("map-tpl").onclick = async () => {
        try {
          const d = await j("POST", "/api/template-analyze", $("config").value);
          regions = d.elements;
          tplBox = d.viewBox;
          for (const e of d.elements) if (e.slot) slotMap[e.id] = e.slot;
          drawRegions();
          $("map-list").innerHTML = "";
          const figs = d.elements.filter((e) => e.tag !== "text");
          const texts = d.elements.filter((e) => e.tag === "text");
          const syncSelects = () => {
            document.querySelectorAll("#map-list select").forEach((sel) => {
              const cur = Object.entries(slotMap).find(
                ([, sl]) => sl === sel.dataset.slot,
              );
              sel.value = cur ? cur[0] : "";
            });
          };
          const mkRow = (slot, els) => {
            const row = document.createElement("div");
            row.className = "map-row";
            const label = document.createElement("code");
            label.textContent = slot;
            row.append(label, "→");
            const sel = document.createElement("select");
            sel.dataset.slot = slot;
            sel.innerHTML =
              `<option value="">—</option>` +
              els
                .map((e) => {
                  const dim = e.w
                    ? ` (${Math.round(e.w)}×${Math.round(e.h)})`
                    : "";
                  return `<option value="${e.id}">${e.id}${dim}</option>`;
                })
                .join("");
            sel.onchange = () => {
              for (const id of Object.keys(slotMap)) {
                if (slotMap[id] === slot) delete slotMap[id];
              }
              if (sel.value) slotMap[sel.value] = slot;
              syncSelects();
              drawRegions();
            };
            row.append(sel);
            return row;
          };
          for (const slot of [
            "image1",
            "image2",
            "image3",
            "image4",
            "image5",
            "image6",
            "text1",
            "text2",
            "text3",
            "text4",
            "text5",
            "text6",
          ]) {
            $("map-list").append(
              mkRow(slot, slot.startsWith("text") ? texts : figs),
            );
          }
          syncSelects();
          $("map-modal").hidden = false;
        } catch (e) {
          status(e.message, false);
        }
      };
      $("map-close").onclick = () => {
        $("map-modal").hidden = true;
      };
      $("map-apply").onclick = async () => {
        const mapping = {};
        document.querySelectorAll("#map-list select").forEach((sel) => {
          if (sel.value) mapping[sel.dataset.slot] = sel.value;
        });
        if (!Object.keys(mapping).length) {
          status("no slots assigned", false);
          return;
        }
        try {
          const d = await j(
            "POST",
            "/api/template-fill",
            JSON.stringify({
              config: JSON.parse($("config").value),
              mapping,
            }),
          );
          patch((o) => {
            o.template = d.template;
          });
          $("map-modal").hidden = true;
          status(`wrote ${d.template}`, true);
        } catch (e) {
          status(e.message, false);
        }
      };
      loadFonts();
      $("save").onclick = async () => {
        try {
          const name = $("site").value;
          await j(
            "POST",
            `/api/save?name=${encodeURIComponent(name)}`,
            $("config").value,
          );
          status(`saved configs/${name}.json`, true);
        } catch (e) {
          status(e.message, false);
        }
      };
      $("render-all").onclick = async () => {
        try {
          const d = await j("POST", "/api/render", $("config").value);
          status(`wrote: ${d.files.join(", ")}`, true);
          $("files").innerHTML = d.files
            .map(
              (f) =>
                `<a href="/out/${f}" target="_blank" rel="noopener">${f}</a>`,
            )
            .join(" · ");
        } catch (e) {
          status(e.message, false);
        }
      };
      loadSites();
    </script>
  </body>
</html>
