# SonarCloud configuration (public project — community tier).
# The CI coverage job produces coverage.out (Go coverprofile) and scans
# only when SONAR_TOKEN is set. Dependabot PRs read the separate Dependabot
# secret store: `gh secret set SONAR_TOKEN --app dependabot`.
sonar.projectKey=gundestrup_logo-generator-flow
sonar.projectName=logo-generator-flow
sonar.organization=gundestrup
sonar.host.url=https://sonarcloud.io
sonar.projectVersion=0.1.1

sonar.sources=.
sonar.tests=.
sonar.exclusions=assets/**,output/**,configs/**,demo/**,docs/**,data/**,**/*_test.go,node_modules/**
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8
