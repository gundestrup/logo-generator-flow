# SonarCloud configuration.
# Set your real project key + organization and add SONAR_TOKEN as a repo
# secret — the CI coverage job scans only when it is present. Dependabot PRs
# use the separate Dependabot secret store: `gh secret set SONAR_TOKEN
# --app dependabot`. Self-hosted SonarQube: also set SONAR_HOST_URL.
sonar.projectKey=logo-generator
sonar.organization=YOUR_ORG
sonar.projectName=logo-generator
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=assets/**,output/**,configs/**,templates/**,demo/**,**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
