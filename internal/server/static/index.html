<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230b1220'/%3E%3Cpath d='M4 8h8M8 4v8' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/vendor/bulma.min.css" />
    <link
      rel="stylesheet"
      href="/fonts.css"
      media="print"
      onload="this.media = 'all'"
    />
    <script src="/static/app.js" defer></script>
    <script src="/static/vendor/alpine-csp.min.js" defer></script>
    <title>logo-generator — editor</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --border: #24334f;
        --text: #dbe4f3;
        --dim: #8ba0c2;
        --accent: #38bdf8;
        --bulma-scheme-h: 222;
        --bulma-scheme-s: 40%;
        --bulma-scheme-l: 10%;
        --bulma-text-l: 85%;
      }
      [x-cloak] {
        display: none !important;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.5 -apple-system,
          "SF Mono",
          Menlo,
          monospace;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      header select {
        width: 170px;
      }
      .select,
      .select select {
        max-width: 100%;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      h1 span {
        color: var(--accent);
      }
      .select select,
      .button,
      .input,
      .textarea,
      input[type="color"] {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
      }
      .select select option {
        background: var(--panel);
      }
      .button.is-primary {
        background: var(--accent);
        color: #04121f;
        font-weight: 700;
        border: none;
      }
      .columns {
        height: calc(100vh - 90px);
        gap: 12px;
        margin-inline: 0;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        padding: 0;
      }
      @media (max-width: 1100px) {
        .columns {
          height: auto;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .card .h2 {
        margin: 0;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-bottom: 1px solid var(--border);
      }
      .card .body {
        padding: 10px;
        flex: 1;
        overflow: auto;
      }
      .column > .card:last-child {
        flex: 1;
      }
      .tpl-stack {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
        min-height: 0;
      }
      #slot-editor {
        flex: none;
      }
      .se-empty {
        color: var(--dim);
        font-size: 12px;
        padding: 8px 2px;
      }
      #tpl-card {
        flex: 1;
      }
      #map-modal {
        flex: 0 1 auto;
        max-height: 60%;
      }
      .textarea {
        width: 100%;
        height: 100%;
        min-height: 300px;
        resize: none;
        background: #0a0f1a;
        color: #c9d6ea;
        font:
          12px/1.5 ui-monospace,
          Menlo,
          monospace;
      }
      .preview {
        display: grid;
        place-items: center;
        background: repeating-conic-gradient(#1a2438 0 25%, #131c2e 0 50%) 0 0 /
          20px 20px;
        border-radius: 8px;
        padding: 6px;
        min-height: 120px;
        aspect-ratio: 1200 / 630;
        contain: size;
        overflow: hidden;
      }
      .preview svg {
        max-width: 100%;
        max-height: 100%;
        height: auto;
      }
      #status {
        font-size: 12px;
        min-height: 1.6em;
        max-width: 32ch;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      input[type="color"] {
        width: 34px;
        height: 26px;
        padding: 0;
        cursor: pointer;
      }
      #font-modal,
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(4, 10, 20, 0.7);
        display: grid;
        place-items: center;
        z-index: 10;
      }
      .dlg {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        width: min(560px, 90vw);
        max-height: 80vh;
        overflow: auto;
      }
      .dlg h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .pick {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin: 4px 0;
        text-align: left;
      }
      .map-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
        font-size: 12px;
      }
      .map-row code {
        color: var(--accent);
        min-width: 60px;
      }
      #tpl-stage {
        position: relative;
        width: 100%;
      }
      #tpl-stage svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #tpl-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .region {
        position: absolute;
        border: 2px dashed var(--dim);
        border-radius: 4px;
        pointer-events: auto;
        cursor: pointer;
      }
      .region.on {
        border-color: var(--accent);
      }
      .region.txt {
        border-style: dotted;
      }
      .region.sel {
        border-color: #34d399;
        border-style: solid;
        background: rgba(52, 211, 153, 0.08);
      }
      #slot-editor .textarea {
        min-height: 60px;
      }
      .se-size {
        width: 4.6em;
        border-color: #3a527a !important;
        background: #0d1526 !important;
      }
      .fontlist {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .frow {
        justify-content: flex-start;
      }
      .fglyph {
        font-size: 18px;
        min-width: 180px;
        text-align: left;
      }
      .fname {
        color: var(--dim);
        font-size: 11px;
      }
      .font-prev {
        font-size: 15px;
        color: var(--text);
        white-space: nowrap;
      }
      #se-body label {
        display: block;
        margin: 8px 0 2px;
      }
      #se-src {
        font-size: 12px;
        color: var(--dim);
        word-break: break-all;
      }
      .region.txt.on {
        border-color: #34d399;
      }
      .region b {
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 10px;
        font-weight: 600;
        color: #fff;
        background: rgba(4, 12, 24, 0.75);
        padding: 0 4px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .h2-tools {
        float: right;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .h2-tools .button {
        padding: 1px 8px;
        font-size: 12px;
        height: auto;
      }
      .h2-tools input[type="color"] {
        width: 26px;
        height: 20px;
        vertical-align: middle;
      }
      .pick img {
        width: 40px;
        height: 40px;
        object-fit: contain;
        background: #0a0f1a;
        border-radius: 6px;
      }
      #status.err {
        color: #f87171;
      }
      #status.ok {
        color: #34d399;
      }
      .files {
        margin-top: 10px;
        font-size: 12px;
      }
      .files a {
        color: var(--accent);
      }
    </style>
  </head>
  <body x-data="editor" x-cloak>
    <header>
      <h1>logo-generator <span>editor</span></h1>
      <label
        >site
        <span class="select is-small">
          <select x-model="site" x-on:change="loadSite(site)" aria-label="site">
            <template x-for="s in sites" :key="s.file">
              <option x-bind:value="s.file" x-text="s.name"></option>
            </template>
          </select>
        </span> </label
      ><button
        type="button"
        class="button is-small"
        title="duplicate this config"
        x-on:click="dupSite()"
      >
        ⧉</button
      ><button
        type="button"
        class="button is-small"
        title="rename this config"
        x-on:click="renameSite()"
      >
        ✎</button
      ><button
        type="button"
        class="button is-small danger"
        title="delete this config"
        x-on:click="deleteSite()"
      >
        ✕</button
      ><button type="button" class="button is-small" x-on:click="renderAll()">
        render all formats
      </button>
      <button
        type="button"
        class="button is-small is-primary"
        x-on:click="save()"
      >
        save
      </button>
      <span id="status" x-bind:class="statusCls" x-text="statusMsg"></span>
    </header>
    <div class="columns">
      <div class="column">
        <section class="card">
          <div class="h2">global settings</div>
          <div class="body">
            <label
              >font
              <span
                class="font-prev"
                x-bind:hidden="!fontSel"
                x-bind:style="fontStyle(fontFamilyFor(fontSel))"
                x-text="selFontLabel() + '  AaBbGg 123'"
              ></span>
              <button
                type="button"
                class="button is-small"
                title="pick font — every family in its own glyphs"
                x-on:click="openFontPick('global')"
              >
                Aa…
              </button></label
            >
          </div>
        </section>
        <section class="card">
          <div class="h2">config</div>
          <div class="body">
            <textarea
              class="textarea"
              x-model="configText"
              x-on:input="previewDebounced()"
              spellcheck="false"
              aria-label="site config JSON"
            ></textarea>
          </div>
        </section>
      </div>
      <div class="column">
        <div class="tpl-stack">
          <section class="card" id="tpl-card">
            <div class="h2">
              template
              <span class="h2-tools">
                <label
                  ><input
                    type="checkbox"
                    x-model="showRegions"
                    x-on:change="drawRegions()"
                  />
                  outlines</label
                >
                <button
                  type="button"
                  class="button is-small"
                  x-on:click="openMap()"
                >
                  map template…
                </button>
              </span>
            </div>
            <div class="body">
              <div class="preview" x-ref="tplPreview">
                <div id="tpl-stage" x-ref="tplStage">
                  <div id="tpl" x-ref="tpl"></div>
                  <div id="tpl-overlay" x-ref="tplOverlay" hidden></div>
                </div>
              </div>
            </div>
          </section>
          <section class="card" id="map-modal" x-show="mapOpen" hidden>
            <div class="h2">
              template regions — assign each element a slot
              <span class="h2-tools">
                <button
                  type="button"
                  class="button is-small is-primary"
                  x-on:click="mapApply()"
                >
                  apply
                </button>
                <button
                  type="button"
                  class="button is-small"
                  x-on:click="mapCancel()"
                >
                  cancel
                </button>
              </span>
            </div>
            <div class="body" id="map-list">
              <template x-for="slot in allSlots" :key="slot">
                <div class="map-row">
                  <code x-text="slot"></code> →
                  <span class="select is-small">
                    <select
                      x-model="mapAssign[slot]"
                      x-on:change="mapAssigned(slot)"
                    >
                      <option value="">—</option>
                      <template x-for="e in elsFor(slot)" :key="e.id">
                        <option
                          x-bind:value="e.id"
                          x-text="mapOptLabel(e)"
                        ></option>
                      </template>
                    </select>
                  </span>
                </div>
              </template>
            </div>
          </section>
          <section class="card" id="slot-editor" x-ref="slotEditor">
            <div class="h2">
              edit <code x-text="editTitle"></code>
              <span class="h2-tools">
                <button
                  type="button"
                  class="button is-small is-primary"
                  x-show="isDirty()"
                  x-on:click="applyEdit()"
                >
                  apply
                </button>
                <button
                  type="button"
                  class="button is-small"
                  title="close"
                  x-show="editOpen"
                  x-on:click="closeEditor()"
                >
                  ×
                </button>
              </span>
            </div>
            <div class="body" id="se-body">
              <div class="se-empty" x-show="!editOpen && !measuring">
                click a template element to edit its slot
              </div>
              <template x-if="draftKind === 'text'">
                <div>
                  <div>
                    <button
                      type="button"
                      class="button is-small"
                      x-on:click="sw('**','**')"
                    >
                      <b>B</b>
                    </button>
                    <button
                      type="button"
                      class="button is-small"
                      x-on:click="sw('*','*')"
                    >
                      <i>I</i>
                    </button>
                    <button
                      type="button"
                      class="button is-small"
                      x-on:click="sw('__','__')"
                    >
                      <u>U</u>
                    </button>
                    <input
                      type="color"
                      x-model="mkColor"
                      x-on:input="swColor()"
                      title="inline color"
                      aria-label="inline color"
                    />
                    <span class="select is-small">
                      <select
                        x-model="mkFont"
                        x-on:change="swFont()"
                        aria-label="inline font"
                      >
                        <option value="">font…</option>
                        <template x-for="f in fontFamilies()" :key="f">
                          <option
                            x-bind:value="f"
                            x-bind:style="fontStyle(f)"
                            x-text="f"
                          ></option>
                        </template>
                      </select>
                    </span>
                    <span
                      class="font-prev"
                      x-bind:hidden="!mkFont"
                      x-bind:style="fontStyle(mkFont)"
                      >AaBbGg 123</span
                    >
                    <button
                      type="button"
                      class="button is-small"
                      title="pick font — previews your selected text"
                      x-on:click="openFontPick('markup')"
                    >
                      Aa…
                    </button>
                    <input
                      type="number"
                      class="input is-small se-size"
                      x-model="mkSize"
                      x-on:change="swSize()"
                      min="1"
                      step="1"
                      placeholder="size"
                      title="wrap selection in [size:N]…[/]"
                      aria-label="inline font-size"
                    />
                  </div>
                  <label
                    >text
                    <textarea
                      class="textarea"
                      x-ref="seText"
                      x-model="dv.text"
                      x-on:input="changed()"
                      spellcheck="false"
                    ></textarea>
                  </label>
                  <label
                    >color
                    <input
                      type="color"
                      x-model="dv.color"
                      x-on:input="changed()"
                  /></label>
                </div>
              </template>
              <template x-if="draftKind === 'image'">
                <div>
                  <div>image</div>
                  <div id="se-src" x-text="srcLabel()"></div>
                  <button
                    type="button"
                    class="button is-small"
                    x-on:click="openPick()"
                  >
                    pick…
                  </button>
                  <span id="se-color-wrap" x-show="srcIsSvg()">
                    <label class="recolor-toggle"
                      ><input
                        type="checkbox"
                        x-model="dv.recolor"
                        x-on:change="changed()"
                      />
                      recolor</label
                    >
                    <template x-if="dv.recolor">
                      <span class="recolor-ctl">
                        <label
                          >fill
                          <input
                            type="color"
                            x-model="dv.fill"
                            x-on:input="changed()"
                        /></label>
                        <label
                          >stroke
                          <input
                            type="color"
                            x-model="dv.stroke"
                            x-on:input="changed()"
                        /></label>
                        <button
                          type="button"
                          class="button is-small"
                          title="reset recolor defaults"
                          x-on:click="resetRecolor()"
                        >
                          ×
                        </button>
                      </span>
                    </template>
                    <span class="orig-hint" x-show="!dv.recolor"
                      >original colors</span
                    >
                  </span>
                </div>
              </template>
            </div>
          </section>
        </div>
      </div>
      <div class="column">
        <section class="card">
          <div class="h2">
            generated
            <span class="h2-tools">
              <label
                >backdrop
                <span class="select is-small">
                  <select
                    x-model="backdrop"
                    x-on:change="backdropChanged()"
                    aria-label="preview backdrop"
                  >
                    <option value="">checker</option>
                    <option value="#ffffff">white</option>
                    <option value="#000000">black</option>
                    <option value="#1a2438">dark</option>
                    <option value="custom">custom…</option>
                  </select>
                </span>
                <input
                  type="color"
                  x-model="bgColor"
                  x-on:input="backdropChanged()"
                  x-show="backdrop === 'custom'"
                  aria-label="custom backdrop color"
              /></label>
            </span>
          </div>
          <div class="body">
            <div class="preview" id="gen" x-ref="gen"></div>
            <div class="files">
              <template x-for="f in filesList" :key="f">
                <!-- biome-ignore lint/a11y/useValidAnchor lint/a11y/useAnchorContent: href and text bound by Alpine -->
                <a
                  x-bind:href="fileUrl(f)"
                  x-text="f"
                  target="_blank"
                  rel="noopener"
                ></a>
              </template>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div
      id="font-modal"
      x-show="fontModalOpen"
      hidden
      x-on:click.self="fontModalOpen = false"
      x-on:keydown.escape.window="fontModalOpen = false"
    >
      <div class="dlg">
        <h2
          x-text="fontPickTarget === 'markup' ? 'pick inline font' : 'pick global font'"
        >
          pick font
        </h2>
        <div class="fontlist">
          <template x-for="r in fontPickRows()" :key="r.path || r.family">
            <button
              type="button"
              class="pick button is-small frow"
              x-on:click="pickFontRow(r)"
            >
              <span
                class="fglyph"
                x-bind:style="fontStyle(r.family)"
                x-text="fontSampleTxt"
              ></span>
              <span class="fname" x-text="r.label"></span>
            </button>
          </template>
        </div>
        <button
          type="button"
          class="button is-small"
          x-on:click="fontModalOpen = false"
        >
          close
        </button>
      </div>
    </div>
    <div
      id="modal"
      x-show="modalOpen"
      hidden
      x-on:click.self="modalOpen = false"
      x-on:keydown.escape.window="modalOpen = false"
    >
      <div class="dlg">
        <h2>assets/images</h2>
        <div>
          <template x-for="i in imgList" :key="i.path">
            <button
              type="button"
              class="pick button is-small"
              x-on:click="pickImg(i)"
            >
              <img x-bind:src="assetUrl(i)" alt="" />
              <span x-text="i.name"></span>
            </button>
          </template>
        </div>
        <button type="button" class="button is-small" x-on:click="closeModal()">
          close
        </button>
      </div>
    </div>
  </body>
</html>
